[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "books-to-postgres"
version = "1.0.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "models>=0.1.0",
    "pandas>=3.0.2",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[tool.uv.sources]
models = { path = "../models", editable = true }
